[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[workspace.dependencies]
nib-proto = { path = "crates/nib-proto" }
nib-syntax = { path = "crates/nib-syntax" }
nib-editor = { path = "crates/nib-editor" }

# Editing core. Internal Helix crate: no API stability, pin to a release tag.
helix-core = { git = "https://github.com/helix-editor/helix", tag = "25.07.1" }
# Must match the versions helix-core 25.07.1 uses (cargo unifies them).
tree-house = { version = "0.3.0", default-features = false }
tree-house-bindings = { version = "0.2.4", features = ["ropey", "tree-sitter-language"] }
tree-sitter-python = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5"
tree-sitter-html = "0.23"
tree-sitter-language = "0.1"

serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
rmp-serde = "1.3"
serde_json = "1"
anyhow = "1"
thiserror = "2"
toml = "0.8"
toml_edit = "0.22"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Fast dev builds of the editing core so debug `nib` stays snappy.
[profile.dev.package."*"]
opt-level = 2

# Used by scripts/nib (run from source): optimized but incremental, so rebuilds take seconds.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false
