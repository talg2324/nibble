# nib config — copy to ~/.config/nib/config.toml (Windows: %APPDATA%\nib\config.toml)
# nibble's defaults are built in, and everything here is commented out: uncomment only what you
# want different. Font, line height, beginner mode, [window], [theme] and [keys] can also be
# changed from Settings (gear icon), which writes them here; tab_width and renderer only here.

[editor]
# tab_width = 4
# font_size = 14
# renderer = "auto"        # "cpu" on GPU-less machines (e.g. Horizon VM), "gpu", or "auto"
#                          # (auto on WSL: finds the GPU once and caches it in ~/.cache/nib/gpu.json)
#                          # read at start: a change needs a restart
# font = "JetBrains Mono"  # code font family; unset = system monospace
# line_height = 1.4
# beginner_mode = false    # shortcut cheat sheet on the right
# blame = true             # selecting code shows who last committed it, when, and the commit

[window]
# width = 1200             # logical pixels; also Settings > Appearance > Window
# height = 800
# fullscreen = false

# Saved connections: `nib @name [path]` opens one, and the SSH panel (server icon) lists them.
# Paths are relative to `root` on the target machine. The SSH panel and `nib ctl ssh add` write
# these for you; examples:
# [profiles.gpu]
# ssh = "gpu-box"          # Host alias from ~/.ssh/config (ProxyJump etc. are honored)
# root = "~/projects/seg"
#
# [profiles.lab]
# ssh = "10.0.0.7"         # or a hostname, or user@host
# user = "ada"             # optional, ssh only: -l
# port = 2222              # -p
# identity = "~/.ssh/lab"  # -i
# jump = "bastion"         # -J
# root = "~/code"
#
# [profiles.ubuntu]
# wsl = "Ubuntu-24.04"     # Windows only
# root = "~/code"
#
# [profiles.here]
# root = "~/src/project"   # neither ssh nor wsl = this machine

# Colours ("#rrggbb"); everything is optional. Built-in defaults shown.
[theme]
# background = "#000000"
# foreground = "#d4d4d4"            # code text
# browser_foreground = "#3b8eea"    # file browser text
# selection = "#264f78"
# dim = "#6e7681"                   # hints, line numbers, status
# accent = "#3b8eea"                # control strip icons
# panel = "#000000"                 # settings, menus, cheat sheet
# [theme.syntax]
# keyword = "#569cd6"
# string = "#ce9178"

# Languages beyond the built-in ones (python, bash, json, yaml, toml, markdown, html). Easiest:
#   nib grammar add rust go javascript     (fetches, compiles and writes these entries)
# which puts grammars/<name>.dylib and queries/<name>/ beside this file. By hand:
# [languages.rust]
# grammar = "rust"               # grammars/rust.{dylib,so}, symbol tree_sitter_rust (default: the name)
# extensions = ["rs"]
# filenames = []                 # whole names, e.g. "Justfile"
# shebangs = ["rust-script"]
# aliases = []                   # other names a ```fence may use (extensions already work)

# Language servers run inside nibd, on the machine with the code, and start when a file they serve
# is opened. Built in: python (ty), rust (rust-analyzer), go (gopls), typescript
# (typescript-language-server), c (clangd), typst (tinymist), latex (texlab). A built-in name
# changes only the fields given; any other name adds a server. A bare command is looked up in
# $PATH, ~/.local/bin, ~/.cargo/bin, ~/go/bin, /opt/homebrew/bin and TeX's own folders (never
# inside the project: name a project's own server by its path).
# [lsp.python]
# command = ["ty", "server"]     # default: ty from .venv, $PATH or ~/.local/bin, else uvx
# [lsp.go]
# command = []                   # turn a built-in off
# [lsp.zig]
# command = ["zls"]
# extensions = ["zig", "zon"]    # claiming an extension takes it from any other server
# roots = ["build.zig"]          # topmost dir holding one is the server's root (default: nib's root)

# Compile on save: saving a file of the language runs this on the machine with the code, and the
# PDF shows beside the source (Settings → Languages sets the program). Built in: typst, latex.
# Placeholders: {main} the saved file, or the root a `% !TEX root = main.tex` /
# `// !typst root = main.typ` line near its top names; {dir} its folder; {root} the folder nib
# has open (or {dir} when the file is outside it), Typst's project root, so a document in a
# subfolder can import `/shared/x.typ`; {stem} its name without the extension; {pdf} the output.
# A built-in name changes only the fields given.
# [compile.typst]
# command = ["typst", "compile", "--root", "{root}", "--diagnostic-format", "short", "{main}", "{pdf}"]
# [compile.latex]
# command = ["latexmk", "-pdf", "-interaction=nonstopmode", "-halt-on-error", "-file-line-error", "-outdir={dir}", "{main}"]
# pdf = "{dir}/{stem}.pdf"       # the file it writes (default)
# [compile.pandoc]
# command = ["pandoc", "{main}", "-o", "{pdf}"]
# extensions = ["md"]            # a new compiler needs these two

# The AI panel.
[ai]
# cloud_models = true   # OpenCode: list its cloud models too (default: only ones downloaded locally)
# pick_model = false    # new agents start with the last model instead of opening the dropdown
# agent = "claude"      # nib writes these two when you pick a model: new agents start with it
# model = "opus"
# effort = "high"       # nib writes these two as you set them: the thinking level and the
# prompt = "Be terse."  # system prompt added to the assistant's own (both set in the agents tab)
# image_zoom_delay = 1.0 # seconds the mouse rests on a picture in the chat before it shows 4x bigger
# worktree_per_feature = false  # default true: an agent that changes files does it on a branch
#                               # of its own, landed on yours as one commit (the WPF switch)

# Override shortcuts: chord = command name, or "none" to unbind.
# Command names: see `nib --commands` (or the command palette, Cmd/Ctrl+Shift+P).
[keys]
# "mod+shift+d" = "duplicate_line"   # mod = Cmd on macOS, Ctrl elsewhere
# "mod+y" = "none"
