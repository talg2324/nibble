[package]
name = "nib"
description = "nibble: minimal, fast, remote-first code editor (Iced GUI client)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "nib"
path = "src/main.rs"

[dependencies]
nib-proto.workspace = true
nib-editor.workspace = true
nib-syntax.workspace = true
helix-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
vt100 = "0.18"
# Task internals, to run the app's tasks without a window (`nib --headless`). Same crate iced uses.
iced_runtime = "0.14"
# iced reports the GPU adapter it picked only through `log` (see gpu_log.rs). Already in the tree via iced.
log = "0.4"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "advanced", "svg", "image-without-codecs", "markdown", "x11", "wayland", "thread-pool"] }
# Decoders for the image viewer (iced only draws; codecs are picked here to keep the build lean).
# ico also decodes the window icon (main.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "webp", "bmp", "ico"] }
csv = "1"
htmd = "0.5"
usvg = { version = "0.45.1", default-features = false }
pulldown-cmark = { version = "0.12", default-features = false }
ratex-parser = "0.1.16"
ratex-layout = "0.1.16"
ratex-types = "0.1.16"
ratex-svg = { version = "0.1.16", features = ["embed-fonts"] }
# Mermaid diagrams in Markdown, to SVG in pure Rust (no browser), with Mermaid's own layout.
merman = { version = "0.11", default-features = false, features = ["all-diagrams", "svg"] }
# PDF viewer: pure-Rust rasterizer.
hayro = "0.9"
arboard = "3.7.0"
# Draws an SVG to pixels, to copy a chat picture to the clipboard. Already in the tree via iced.
resvg = "0.45"
# The window's handle, to ask the OS where a file was dropped (winit doesn't say).
raw-window-handle = "0.6"
# Pictures of a page come from the browser as base64 (web/). Already in the tree.
base64 = "0.22"


[target.'cfg(unix)'.dependencies]
# getuid, for the control socket's private directory.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# AF_UNIX sockets on Windows 10 1803+ (std has them on Unix only): the control socket.
uds_windows = "1"
# Letting go of the console window when started from Explorer (main.rs). Already in the tree.
# And the shell's "open" for links (app/viewers.rs).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
# Builds nib.rc into nib.exe: the icon Explorer and the taskbar show (build.rs).
embed-resource = "3.0.12"

[target.'cfg(target_os = "macos")'.dependencies]
# Where the mouse is when a file is dropped on the window (see `drop.rs`). Same versions winit uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow"] }
# The app's name in the menu bar, the Dock and Cmd-Tab (`name_the_app` in main.rs): NSProcessInfo.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSProcessInfo", "NSString"] }
