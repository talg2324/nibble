# Every push to main and every pull request: the tests on Linux, macOS and Windows.
# "Run workflow" (Actions tab) runs them on any branch, on the systems `os` picks, optionally only
# the tests `test` names (cargo test arguments):
#   gh workflow run ci.yml --ref BRANCH -f os=ubuntu -f test="-p nibd codex_app_server"
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: 'Run on'
        type: choice
        options: [all, ubuntu, macos, windows]
        default: all
      test:
        description: 'Only these cargo test arguments (empty: the whole workspace)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == '' || inputs.os == 'all') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || format('["{0}-latest"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: inputs.test == ''
        run: cargo test --workspace --locked
      - if: inputs.test != ''
        run: cargo test --locked ${{ inputs.test }}
