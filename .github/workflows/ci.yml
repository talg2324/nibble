# Every push to main and every pull request: the tests on Linux, macOS and Windows.
# "Run workflow" (Actions tab) runs them on any branch, on the systems `os` picks, optionally only
# the tests `test` names (cargo test arguments):
#   gh workflow run ci.yml --ref BRANCH -f os=ubuntu -f test="-p nibd codex_app_server"
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      os:
        description: 'Run on'
        type: choice
        options: [all, ubuntu, macos, windows]
        default: all
      test:
        description: 'Only these cargo test arguments (empty: the whole workspace)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((inputs.os == '' || inputs.os == 'all') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || format('["{0}-latest"]', inputs.os)) }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: inputs.test == ''
        run: cargo test --workspace --locked
      - if: inputs.test != ''
        run: cargo test --locked ${{ inputs.test }}

  # The Windows installer the way users run it: `irm | iex` in Windows PowerShell 5.1, from a
  # server that, like GitHub's release downloads, says application/octet-stream and no charset.
  installer-windows:
    name: install.ps1 in Windows PowerShell 5.1
    if: inputs.test == '' && (inputs.os == '' || inputs.os == 'all' || inputs.os == 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}   # so the installer checks provenance with gh
        run: |
          # 'Stop' on purpose: the installer has to work for users who set it in their profile.
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion.Major -ne 5) { throw "expected Windows PowerShell 5.1, got $($PSVersionTable.PSVersion)" }
          $dir = Join-Path $env:RUNNER_TEMP 'serve'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item scripts/install/install.ps1 $dir
          # Control: a UTF-8 file must come out garbled, or this server isn't GitHub-like.
          [IO.File]::WriteAllText((Join-Path $dir 'control.ps1'), "'$([char]0x2713)'", (New-Object Text.UTF8Encoding $false))
          $server = Start-Job -ArgumentList $dir {
            param($dir)
            $l = New-Object Net.HttpListener; $l.Prefixes.Add('http://localhost:8765/'); $l.Start()
            while ($true) {
              $c = $l.GetContext()
              $b = [IO.File]::ReadAllBytes((Join-Path $dir $c.Request.Url.Segments[-1]))
              $c.Response.ContentType = 'application/octet-stream'
              $c.Response.OutputStream.Write($b, 0, $b.Length); $c.Response.Close()
            }
          }
          Start-Sleep 3
          try {
            $control = irm http://localhost:8765/control.ps1
            if ($control -eq "'$([char]0x2713)'") { throw 'control came through intact: the server does not reproduce GitHub' }
            $text = irm http://localhost:8765/install.ps1
            if ($text -ne [IO.File]::ReadAllText((Resolve-Path scripts/install/install.ps1), [Text.Encoding]::UTF8)) { throw 'install.ps1 arrived changed by the download' }
            $out = & ([scriptblock]::Create($text)) -Yes -NoRemotes -NoModifyPath -NoUpstream -Prefix (Join-Path $env:RUNNER_TEMP 'nib') 6>&1 | Out-String
            $out
            if ($out -notmatch [char]0x2713) { throw 'no check marks in the output' }
            if ($out -match "$([char]0xE2)|$([char]0xC2)") { throw 'garbled characters in the output' }
            if ($out -notmatch 'Provenance|provenance: not checked') { throw 'provenance went unmentioned' }
            if ($out -match 'space toggle') { throw '-Yes showed the keys for a choice it does not offer' }
            if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'nib\nib.exe'))) { throw 'nib.exe was not installed' }
          } finally { Stop-Job $server }
