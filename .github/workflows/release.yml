# A tag vX.Y on a commit of main publishes GitHub Release vX.Y with:
#   nibble-vX.Y-<triple>.tar.gz / .zip   the client (nib + nibd + .skills) for macOS, Linux, Windows
#   nibd-vX.Y-<musl triple>.tar.gz       the static Linux daemon for SSH / WSL remotes (any distro)
#   nib-grammars-vX.Y-<triple>.tar.gz    prebuilt grammars `nib grammar add` downloads (no compiler)
#   install.sh, install.ps1              when the tagged commit has scripts/install.{sh,ps1}
#   SHA256SUMS
# The tag must match the workspace version in Cargo.toml (v0.4 <-> 0.4.0).
#
# "Run workflow" (Actions tab) on any branch builds everything and keeps the archives as the
# run's artifacts, without publishing a release.
name: release

on:
  push:
    tags: ['v[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: v
        run: |
          ws="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "${tag#v}.0" != "$ws" ]]; then
              echo "::error::tag $tag does not match the workspace version $ws in Cargo.toml"; exit 1
            fi
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::tag $tag is not on a commit of main"; exit 1
            fi
            echo "version=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "version=v${ws%.0}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

  daemon:
    needs: check
    name: nibd ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: NIB_DAEMON_TARGETS=${{ matrix.target }} scripts/build.sh daemons
      - run: scripts/package.sh daemon ${{ matrix.target }} ${{ needs.check.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: nibd-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  client:
    needs: check
    name: nibble ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # Linux: built on Ubuntu 22.04 (glibc 2.35), so it runs on distros from 2022 on.
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, container: '' }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest, container: 'ubuntu:22.04' }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, container: '' }
    steps:
      - if: matrix.container != ''
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config libxkbcommon-dev libwayland-dev
      - uses: actions/checkout@v5
      # The container runs as root on a checkout owned by the runner: let git (BUILD_INFO) read it.
      - if: matrix.container != ''
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build.sh client
      - run: scripts/package.sh client ${{ matrix.target }} ${{ needs.check.outputs.version }}
      # The languages nib offers on first run, compiled for this platform (Windows: clang, which
      # the runner has).
      - run: |
          nib="dist/${{ matrix.target }}/nib"; [[ -f "$nib.exe" ]] && nib="$nib.exe"
          "$nib" grammar build "dist/grammars/${{ matrix.target }}"
      - run: scripts/package.sh grammars ${{ matrix.target }} ${{ needs.check.outputs.version }}
      - uses: actions/upload-artifact@v4
        with:
          name: nibble-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  release:
    needs: [check, daemon, client]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - run: |
          for f in scripts/install.sh scripts/install.ps1; do
            if [[ -f "$f" ]]; then cp "$f" assets/; fi
          done
          (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.version }}
        run: gh release create "$TAG" assets/* --verify-tag --title "nibble $TAG" --generate-notes
